# C0档调参变体B: HANDOFF完整配方 ent_coef 0.003 + k_dist 2 + rollout 512
tag: c0_oracle_v2b
env:
  n_pursuers: 3
  speed_ratio: 0.8
  n_static_obs: 5
  n_dynamic_obs: 0
  obs_mode: oracle
  sense_range: 200.0
  fov_half: 3.14159
  max_steps: 500
  k_dist: 2.0               # 增强接近势函数梯度
train:
  seed: 1
  n_env: 8
  rollout: 512
  iters: 600
  hidden: 128
  lr: 3.0e-4
  clip: 0.2
  epochs: 10
  minibatch: 4
  ent_coef: 0.003
  gamma: 0.99
  lam: 0.95
  log_every: 5
  eval_every: 50
  eval_episodes: 20
