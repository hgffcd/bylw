# J8 stage A: same-seed J5 IMM-fixed transfer; target reaction curriculum at full visibility.
tag: journal_j8_stage_a_imm_fixed
recipe: recipe_v4
env:
  n_pursuers: 3
  speed_ratio: 0.6
  n_static_obs: 8
  n_dynamic_obs: 2
  dyn_obs_speed: 2.0
  evader_type: reactive_mode_switch
  evader_mode_dwell: [2.0, 4.0]
  evader_turn_rate: 0.3
  evader_pursuer_repulsion_gain: 0.0
  evader_pursuer_reaction_range: 30.0
  obs_mode: belief
  sense_range: 200.0
  fov_half: 3.14159
  max_steps: 500
train:
  seed: 1
  iters: 800
  anneal:
    start: 50
    end: 600
    fields:
      evader_pursuer_repulsion_gain: [0.0, 1.0]
  belief_source: imm
  belief_variant: fixed_confidence
  filter_params:
    imm:
      q: 8.0
      r: 0.01
      p_stay: 0.95
