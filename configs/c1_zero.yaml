# C1档: 有限视场+稀疏遮挡, 失观处理=清零基线 —— 里程碑M2起点
tag: c1_zero
env:
  n_pursuers: 3
  speed_ratio: 0.9
  n_static_obs: 8
  n_dynamic_obs: 0
  obs_mode: zero
  sense_range: 25.0
  fov_half: 1.0472          # 60度
  lost_cap_steps: 100
  max_steps: 500
train:
  seed: 1
  n_env: 8
  rollout: 256
  iters: 1200
  hidden: 128
  lr: 3.0e-4
  clip: 0.2
  epochs: 10
  minibatch: 4
  ent_coef: 0.01
  gamma: 0.99
  lam: 0.95
  log_every: 5
  eval_every: 50
  eval_episodes: 20
