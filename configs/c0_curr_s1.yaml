# C0档捕获半径课程 阶段1/3: rho_c=12 放大捕获域让成功信号出现 (P06式课程, 对策"贴环悬停"局部最优)
# 底方案=v2c配方(ent_coef 0.001 + k_dist 2 + 碰撞只罚不终止) + log_std钳制
tag: c0_curr_s1
env:
  n_pursuers: 3
  speed_ratio: 0.8
  n_static_obs: 5
  n_dynamic_obs: 0
  obs_mode: oracle
  sense_range: 200.0
  fov_half: 3.14159
  max_steps: 500
  k_dist: 2.0
  collision_terminates: false
  capture_radius: 12.0
train:
  seed: 1
  n_env: 8
  rollout: 256
  iters: 400
  hidden: 128
  lr: 3.0e-4
  clip: 0.2
  epochs: 10
  minibatch: 4
  ent_coef: 0.001
  gamma: 0.99
  lam: 0.95
  log_every: 5
  eval_every: 50
  eval_episodes: 20
