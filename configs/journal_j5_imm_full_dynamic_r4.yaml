# J5 clean-lineage dynamic IMM full-belief method; identical to J2a except tag.
tag: journal_j5_imm_full_dynamic
recipe: recipe_v4
env:
  n_pursuers: 3
  speed_ratio: 0.6
  n_static_obs: 8
  n_dynamic_obs: 2
  dyn_obs_speed: 2.0
  obs_mode: belief
  sense_range: 200.0
  fov_half: 3.14159
  max_steps: 500
train:
  seed: 1
  iters: 1200
  anneal:
    start: 50
    end: 800
    fields:
      sense_range: [200.0, 25.0]
      fov_half: [3.14159, 1.0472]
  belief_source: imm
  belief_variant: belief
  filter_params:
    imm:
      q: 8.0
      r: 0.01
      p_stay: 0.95
