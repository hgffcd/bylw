# C0档调参变体C: 激进利用 ent_coef 0.001 + k_dist 2 + 碰撞不终止(只罚, 降低早期探索难度)
tag: c0_oracle_v2c
env:
  n_pursuers: 3
  speed_ratio: 0.8
  n_static_obs: 5
  n_dynamic_obs: 0
  obs_mode: oracle
  sense_range: 200.0
  fov_half: 3.14159
  max_steps: 500
  k_dist: 2.0
  collision_terminates: false   # HANDOFF注意事项: M1卡住时先只罚不终止, C2档再打开
train:
  seed: 1
  n_env: 8
  rollout: 256
  iters: 600
  hidden: 128
  lr: 3.0e-4
  clip: 0.2
  epochs: 10
  minibatch: 4
  ent_coef: 0.001
  gamma: 0.99
  lam: 0.95
  log_every: 5
  eval_every: 50
  eval_episodes: 20
