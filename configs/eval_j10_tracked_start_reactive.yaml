# J10 tracked-start protocol.  Relative to eval_j7_reactive_mode_switch.yaml,
# the only environment change is require_initial_visibility: false -> true.
tag: eval_j10_tracked_start_reactive
env:
  n_pursuers: 3
  speed_ratio: 0.6
  n_static_obs: 8
  n_dynamic_obs: 2
  dyn_obs_speed: 2.0
  evader_type: reactive_mode_switch
  evader_mode_dwell: [2.0, 4.0]
  evader_turn_rate: 0.3
  evader_pursuer_repulsion_gain: 1.0
  evader_pursuer_reaction_range: 30.0
  obs_mode: zero
  sense_range: 25.0
  fov_half: 1.0472
  max_steps: 500
  k_dist: 2.0
  k_col: 20.0
  collision_terminates: true
  capture_radius: 5.0
  max_gap: 3.14159265
  gamma_pbrs: 1.0
  require_initial_visibility: true
train:
  hidden: 128
