# C1档 last基线(最后观测点) recipe_v4: 与 c1_zero_anneal_r2.yaml 仅 obs_mode 不同
# 接力用法: --resume <C0种子best_eval.pt> --seed <s>
tag: c1_last
recipe: recipe_v4
env:
  n_pursuers: 3
  speed_ratio: 0.6
  n_static_obs: 8
  n_dynamic_obs: 0
  obs_mode: last
  sense_range: 200.0
  fov_half: 3.14159
  max_steps: 500
train:
  seed: 1
  iters: 1200
  anneal:
    start: 50
    end: 800
    fields:
      sense_range: [200.0, 25.0]
      fov_half: [3.14159, 1.0472]
