# C0档: 无失观(oracle观测)、慢目标、稀疏静态障碍 —— 里程碑M1
tag: c0_oracle
env:
  n_pursuers: 3
  speed_ratio: 0.8
  n_static_obs: 5
  n_dynamic_obs: 0
  obs_mode: oracle
  sense_range: 200.0        # C0: 近似全向全域感知
  fov_half: 3.14159
  max_steps: 500
train:
  seed: 1
  n_env: 8
  rollout: 256
  iters: 600
  hidden: 128
  lr: 3.0e-4
  clip: 0.2
  epochs: 10
  minibatch: 4
  ent_coef: 0.01
  gamma: 0.99
  lam: 0.95
  log_every: 5
  eval_every: 50
  eval_episodes: 20
