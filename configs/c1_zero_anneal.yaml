# C1档(失观清零基线)退火接力: 从C0收敛策略(currv3 final)续训, 沿失观强度轴平滑引入感知受限
# it50-800退火 sense 200->25, fov pi->60度半角, speed_ratio 0.8->0.9; 围捕判据保持真实值
tag: c1_zero_anneal
env:
  n_pursuers: 3
  speed_ratio: 0.8
  n_static_obs: 8
  n_dynamic_obs: 0
  obs_mode: zero
  sense_range: 200.0
  fov_half: 3.14159
  max_steps: 500
  k_dist: 2.0
  k_col: 20.0
  collision_terminates: false
  capture_radius: 5.0
  max_gap: 3.14159265
  gamma_pbrs: 1.0
train:
  seed: 1
  n_env: 8
  rollout: 256
  iters: 1200
  hidden: 128
  lr: 3.0e-4
  actor_lr: 5.0e-5
  critic_lr: 1.0e-3
  clip: 0.2
  epochs: 4
  minibatch: 4
  ent_coef: 0.0005
  gamma: 0.99
  lam: 0.95
  log_every: 5
  eval_every: 50
  eval_episodes: 20
  anneal:
    start: 50
    end: 800
    fields:
      sense_range: [200.0, 25.0]
      fov_half: [3.14159, 1.0472]
      speed_ratio: [0.8, 0.9]
